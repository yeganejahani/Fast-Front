<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>جمع دوعدد</title>
</head>
<body>
    <h2>جمع دوعدد</h2>
    <input id="num1" placeholder="عدد اول">
    <br><br>
    <input id="num2" placeholder="عدد دوم">
    <br><br>
    <button onclick="sum()">جمع</button>
    <button onclick="sub()">تفریق</button>
    <button onclick="mul()">ضرب</button>
    <button onclick="div()">تقسیم</button>
    <p id="result"></p>

    <script>
        function sum(){
            var a = Number(document.getElementById("num1").value)
            var b = Number(document.getElementById("num2").value)
            var sum = a + b
            document.getElementById("result").innerHTML = "حاصل جمع: " + sum
        }
        function sub(){
            var a = Number(document.getElementById("num1").value)
            var b = Number(document.getElementById("num2").value)
            var sub = a - b
            document.getElementById("result").innerHTML = "حاصل تفریق: " + sub
        }
        function mul(){
            var a = Number(document.getElementById("num1").value)
            var b = Number(document.getElementById("num2").value)
            var mul = a * b
            document.getElementById("result").innerHTML = "حاصل ضرب: " + mul
        }
        function div(){
            var a = Number(document.getElementById("num1").value)
            var b = Number(document.getElementById("num2").value)
            var div = a / b
            document.getElementById("result").innerHTML = "حاصل تقسیم: " + div
        }
    </script>
</body>
</html>
